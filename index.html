<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kortspilsportalen - Dit hjem for kortspil</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel to transpile JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1E40AF', // Deep blue
                        secondary: '#9333EA', // Purple
                        accent: '#F59E0B', // Amber
                        dark: '#111827',
                        light: '#F3F4F6'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827; /* Tailwind gray-900 */
            color: #F3F4F6; /* Tailwind gray-100 */
            scroll-behavior: smooth;
        }

        /* Custom Scrollbar for a premium feel */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #1f2937; 
        }
        ::-webkit-scrollbar-thumb {
            background: #4b5563; 
            border-radius: 5px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280; 
        }

        /* Glassmorphism utility */
        .glass {
            background: rgba(31, 41, 55, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .gradient-text {
            background: linear-gradient(to right, #60A5FA, #A78BFA);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // --- SVG Icons Components (Fallback if Lucide doesn't load immediately) ---
        const IconSpade = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" className={className}>
                <path d="M12 2C7 8 5 12 5 15c0 3.866 3.134 7 7 7s7-3.134 7-7c0-3-2-7-7-13zm0 18c-2.761 0-5-2.239-5-5 0-2.333 1.5-5.667 5-10.333C15.5 9.333 17 12.667 17 15c0 2.761-2.239 5-5 5z"/>
                <path d="M11 16h2v6h-2z"/>
            </svg>
        );

        const IconHeart = ({ className }) => (
             <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" className={className}>
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
        );
        
        const IconClub = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" className={className}>
                <path d="M12 2c-1.657 0-3 1.343-3 3 0 1.258.777 2.334 1.888 2.798C9.408 8.441 8 10.05 8 12c0 2.209 1.791 4 4 4s4-1.791 4-4c0-1.95-1.408-3.559-2.888-4.202C14.223 7.334 15 6.258 15 5c0-1.657-1.343-3-3-3z"/>
                <path d="M8.5 12c-1.93 0-3.5 1.57-3.5 3.5S6.57 19 8.5 19H11v3h2v-3h2.5c1.93 0 3.5-1.57 3.5-3.5S17.43 12 15.5 12c-1.503 0-2.784.954-3.28 2.308C11.724 12.954 10.443 12 8.5 12z"/>
            </svg>
        );

        const IconDiamond = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" className={className}>
                <path d="M12 2L2 12l10 10 10-10L12 2zm0 16.5L4.5 12 12 4.5 19.5 12 12 18.5z"/>
            </svg>
        );


        // --- Data Definitions ---
        const gamesData = [
            {
                id: 'whist',
                title: 'Whist',
                description: 'Et klassisk stiktagning-spil, der kræver strategisk tænkning og godt makkerskab. Perfekt til hyggelige aftener.',
                icon: <IconSpade className="w-8 h-8 text-blue-400" />,
                players: '4 spillere',
                difficulty: 'Mellem',
                features: ['Stiktagning', 'Makkerskab', 'Klassiker']
            },
            {
                id: 'casino',
                title: 'Casino',
                description: 'Et sjovt og tempofyldt spil, hvor det gælder om at samle pointkort ved at bygge og fange kort på bordet.',
                icon: <IconDiamond className="w-8 h-8 text-red-400" />,
                players: '2-4 spillere',
                difficulty: 'Let',
                features: ['Samlekort', 'Hurtigt tempo', 'Familievenligt']
            },
            {
                id: 'bridge',
                title: 'Bridge',
                description: 'Kongen af kortspil. Et komplekst og dybt strategisk stiktagning-spil med meldefase. For de dedikerede spillere.',
                icon: <IconHeart className="w-8 h-8 text-red-500" />,
                players: '4 spillere',
                difficulty: 'Svær',
                features: ['Turnering', 'Meldefase', 'Avanceret strategi']
            },
            {
                id: 'andre',
                title: 'Andre Kortspil',
                description: 'Udforsk vores store samling af andre populære kortspil som Hjerterfri, 500, og mange flere.',
                icon: <IconClub className="w-8 h-8 text-green-400" />,
                players: 'Varierer',
                difficulty: 'Alle niveauer',
                features: ['Variation', 'Underholdning', 'Nye udfordringer']
            }
        ];

        // --- Components ---

        const Navbar = () => {
            const [isScrolled, setIsScrolled] = useState(false);
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

            useEffect(() => {
                const handleScroll = () => {
                    setIsScrolled(window.scrollY > 20);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const navLinks = [
                { name: 'Hjem', href: '#home' },
                { name: 'Spil', href: '#games' },
                { name: 'Regler', href: '#rules' },
                { name: 'Om Os', href: '#about' }
            ];

            return (
                <nav className={`fixed w-full z-50 transition-all duration-300 ${isScrolled ? 'glass py-3' : 'bg-transparent py-5'}`}>
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="flex justify-between items-center">
                            {/* Logo */}
                            <div className="flex-shrink-0 flex items-center">
                                <a href="#" className="text-2xl font-bold flex items-center gap-2">
                                    <IconSpade className="w-8 h-8 text-blue-500" />
                                    <span className="gradient-text">KortspilsPortalen</span>
                                </a>
                            </div>

                            {/* Desktop Menu */}
                            <div className="hidden md:flex space-x-8 items-center">
                                {navLinks.map((link) => (
                                    <a 
                                        key={link.name} 
                                        href={link.href}
                                        className="text-gray-300 hover:text-white transition-colors duration-200 text-sm font-medium"
                                    >
                                        {link.name}
                                    </a>
                                ))}
                                <button className="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-full font-medium transition-colors shadow-lg shadow-blue-500/30">
                                    Spil Nu
                                </button>
                            </div>

                            {/* Mobile Menu Button */}
                            <div className="md:hidden flex items-center">
                                <button 
                                    onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                                    className="text-gray-300 hover:text-white focus:outline-none"
                                >
                                    <svg className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        {mobileMenuOpen ? (
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                                        ) : (
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" />
                                        )}
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Mobile Menu Dropdown */}
                    {mobileMenuOpen && (
                        <div className="md:hidden glass absolute top-full left-0 w-full border-t border-gray-700">
                            <div className="px-2 pt-2 pb-4 space-y-1 sm:px-3">
                                {navLinks.map((link) => (
                                    <a
                                        key={link.name}
                                        href={link.href}
                                        className="block px-3 py-2 rounded-md text-base font-medium text-gray-300 hover:text-white hover:bg-gray-800"
                                        onClick={() => setMobileMenuOpen(false)}
                                    >
                                        {link.name}
                                    </a>
                                ))}
                                <button className="w-full text-left block px-3 py-2 mt-4 text-base font-medium text-white bg-blue-600 rounded-md">
                                    Spil Nu
                                </button>
                            </div>
                        </div>
                    )}
                </nav>
            );
        };

        const Hero = () => {
            return (
                <section id="home" className="relative min-h-screen flex items-center justify-center overflow-hidden pt-20">
                    {/* Background decorations */}
                    <div className="absolute top-1/4 -left-20 w-72 h-72 bg-blue-600 rounded-full mix-blend-multiply filter blur-[100px] opacity-40 animate-blob"></div>
                    <div className="absolute top-1/3 -right-20 w-72 h-72 bg-purple-600 rounded-full mix-blend-multiply filter blur-[100px] opacity-40 animate-blob animation-delay-2000"></div>
                    <div className="absolute -bottom-32 left-1/2 w-72 h-72 bg-pink-600 rounded-full mix-blend-multiply filter blur-[100px] opacity-40 animate-blob animation-delay-4000"></div>

                    <div className="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col lg:flex-row items-center gap-12">
                        {/* Text Content */}
                        <div className="text-center lg:text-left lg:w-1/2">
                            <h1 className="text-5xl md:text-7xl font-extrabold tracking-tight mb-6">
                                Mester dine <br />
                                <span className="gradient-text">Favorit Kortspil</span>
                            </h1>
                            <p className="mt-4 text-xl text-gray-400 mb-8 max-w-2xl mx-auto lg:mx-0">
                                Dyk ned i en verden af strategi, held og dygtighed. Uanset om du er til Whist, Casino eller Bridge, har vi guiderne og fællesskabet til dig.
                            </p>
                            <div className="flex flex-col sm:flex-row gap-4 justify-center lg:justify-start">
                                <a href="#games" className="px-8 py-4 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold text-lg transition-all shadow-[0_0_20px_rgba(37,99,235,0.4)] hover:shadow-[0_0_30px_rgba(37,99,235,0.6)]">
                                    Udforsk Spil
                                </a>
                                <a href="#rules" className="px-8 py-4 bg-gray-800 hover:bg-gray-700 text-white rounded-lg font-semibold text-lg transition-all border border-gray-700">
                                    Lær Reglerne
                                </a>
                            </div>
                        </div>

                        {/* Floating Cards Illustration */}
                        <div className="lg:w-1/2 relative h-[400px] w-full max-w-md mx-auto hidden md:block">
                            <div className="absolute inset-0 flex items-center justify-center">
                                {/* Card 1 */}
                                <div className="absolute transform -rotate-12 -translate-x-12 w-48 h-72 bg-white rounded-xl shadow-2xl border-4 border-gray-200 flex flex-col justify-between p-4 transition-transform duration-500 hover:-translate-y-4 hover:rotate-0 z-10">
                                    <div className="text-red-500 text-2xl font-bold flex justify-between"><span>A</span><IconHeart className="w-6 h-6" /></div>
                                    <IconHeart className="w-16 h-16 text-red-500 mx-auto" />
                                    <div className="text-red-500 text-2xl font-bold flex justify-between rotate-180"><span>A</span><IconHeart className="w-6 h-6" /></div>
                                </div>
                                {/* Card 2 */}
                                <div className="absolute transform rotate-6 translate-x-12 translate-y-8 w-48 h-72 bg-white rounded-xl shadow-2xl border-4 border-gray-200 flex flex-col justify-between p-4 transition-transform duration-500 hover:-translate-y-4 hover:rotate-0 z-20">
                                    <div className="text-black text-2xl font-bold flex justify-between"><span>K</span><IconSpade className="w-6 h-6" /></div>
                                    <IconSpade className="w-16 h-16 text-black mx-auto" />
                                    <div className="text-black text-2xl font-bold flex justify-between rotate-180"><span>K</span><IconSpade className="w-6 h-6" /></div>
                                </div>
                                {/* Card 3 */}
                                <div className="absolute transform rotate-24 translate-x-32 -translate-y-4 w-48 h-72 bg-white rounded-xl shadow-2xl border-4 border-gray-200 flex flex-col justify-between p-4 transition-transform duration-500 hover:-translate-y-4 hover:rotate-0 z-0 opacity-80">
                                    <div className="text-red-500 text-2xl font-bold flex justify-between"><span>Q</span><IconDiamond className="w-6 h-6" /></div>
                                    <IconDiamond className="w-16 h-16 text-red-500 mx-auto" />
                                    <div className="text-red-500 text-2xl font-bold flex justify-between rotate-180"><span>Q</span><IconDiamond className="w-6 h-6" /></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const GameCard = ({ game }) => {
            return (
                <div className="glass rounded-2xl p-6 transition-all duration-300 hover:transform hover:-translate-y-2 hover:shadow-2xl hover:shadow-blue-500/20 group border border-gray-800 hover:border-blue-500/50 flex flex-col h-full">
                    <div className="bg-gray-800/50 rounded-xl p-4 w-16 h-16 flex items-center justify-center mb-6 group-hover:scale-110 transition-transform">
                        {game.icon}
                    </div>
                    <h3 className="text-2xl font-bold mb-3 text-white">{game.title}</h3>
                    <p className="text-gray-400 mb-6 flex-grow leading-relaxed">
                        {game.description}
                    </p>
                    
                    <div className="space-y-3 mb-6">
                        <div className="flex justify-between text-sm">
                            <span className="text-gray-500">Spillere</span>
                            <span className="font-medium text-gray-300">{game.players}</span>
                        </div>
                        <div className="flex justify-between text-sm">
                            <span className="text-gray-500">Sværhedsgrad</span>
                            <span className="font-medium text-gray-300">{game.difficulty}</span>
                        </div>
                    </div>

                    <div className="flex flex-wrap gap-2 mt-auto">
                        {game.features.map((feature, index) => (
                            <span key={index} className="text-xs font-medium px-2.5 py-1 rounded-full bg-blue-900/30 text-blue-300 border border-blue-800/50">
                                {feature}
                            </span>
                        ))}
                    </div>
                    
                    <button className="mt-6 w-full py-3 rounded-lg bg-gray-800 hover:bg-blue-600 text-white font-medium transition-colors border border-gray-700 hover:border-transparent group-hover:bg-blue-600">
                        Læs mere om {game.title}
                    </button>
                </div>
            );
        };

        const GamesSection = () => {
            return (
                <section id="games" className="py-24 relative">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="text-center mb-16">
                            <h2 className="text-sm font-bold text-blue-500 tracking-wider uppercase mb-2">Vores Udvalg</h2>
                            <h3 className="text-3xl md:text-4xl font-bold text-white">Find Dit Næste Yndlingsspil</h3>
                            <div className="mt-4 h-1 w-24 bg-gradient-to-r from-blue-500 to-purple-500 mx-auto rounded-full"></div>
                        </div>

                        {/* Grid structure makes it flexible to add more cards */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
                            {gamesData.map((game) => (
                                <GameCard key={game.id} game={game} />
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const InfoSection = () => {
            return (
                <section className="py-24 bg-gray-900 relative border-t border-gray-800">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="flex flex-col lg:flex-row items-center gap-16">
                            <div className="lg:w-1/2">
                                <h2 className="text-3xl md:text-4xl font-bold mb-6">Hvorfor spille kort?</h2>
                                <p className="text-gray-400 text-lg mb-6 leading-relaxed">
                                    Kortspil er mere end bare underholdning. Det er hjernetræning, socialt samvær og en fantastisk måde at koble af fra skærme på (selvom du læser dette på en!).
                                </p>
                                <ul className="space-y-4">
                                    {[
                                        'Styrker strategisk tænkning og hukommelse',
                                        'Fremragende social aktivitet for alle aldre',
                                        'Nem at have med overalt - kræver kun ét spil kort',
                                        'Uendelige variationer og spiltyper'
                                    ].map((item, i) => (
                                        <li key={i} className="flex items-start gap-3">
                                            <div className="mt-1 bg-blue-500/20 p-1 rounded-full text-blue-400">
                                                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>
                                            </div>
                                            <span className="text-gray-300">{item}</span>
                                        </li>
                                    ))}
                                </ul>
                            </div>
                            
                            <div className="lg:w-1/2 grid grid-cols-2 gap-4 w-full">
                                <div className="space-y-4">
                                    <div className="glass p-6 rounded-2xl border border-gray-700 bg-gray-800/30">
                                        <div className="text-4xl font-bold text-blue-400 mb-2">52</div>
                                        <div className="text-sm text-gray-400">Kort i et standard spil</div>
                                    </div>
                                    <div className="glass p-6 rounded-2xl border border-gray-700 bg-gray-800/30">
                                        <div className="text-4xl font-bold text-purple-400 mb-2">100+</div>
                                        <div className="text-sm text-gray-400">Forskellige populære spil</div>
                                    </div>
                                </div>
                                <div className="space-y-4 mt-8">
                                    <div className="glass p-6 rounded-2xl border border-gray-700 bg-gray-800/30 h-full flex flex-col justify-center">
                                        <div className="text-4xl font-bold text-green-400 mb-2">∞</div>
                                        <div className="text-sm text-gray-400">Timers underholdning</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const Footer = () => {
            return (
                <footer className="bg-gray-950 pt-16 pb-8 border-t border-gray-800">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-12 mb-12">
                            <div className="col-span-1 md:col-span-2">
                                <a href="#" className="text-2xl font-bold flex items-center gap-2 mb-4">
                                    <IconSpade className="w-6 h-6 text-blue-500" />
                                    <span className="text-white">KortspilsPortalen</span>
                                </a>
                                <p className="text-gray-400 max-w-sm">
                                    Din ultimative destination for at lære, spille og mestre de bedste kortspil. Uanset niveau er der en plads ved bordet til dig.
                                </p>
                            </div>
                            
                            <div>
                                <h4 className="text-white font-semibold mb-4">Spil</h4>
                                <ul className="space-y-2">
                                    <li><a href="#" className="text-gray-400 hover:text-blue-400 transition">Whist</a></li>
                                    <li><a href="#" className="text-gray-400 hover:text-blue-400 transition">Casino</a></li>
                                    <li><a href="#" className="text-gray-400 hover:text-blue-400 transition">Bridge</a></li>
                                    <li><a href="#" className="text-gray-400 hover:text-blue-400 transition">Alle Spil</a></li>
                                </ul>
                            </div>
                            
                            <div>
                                <h4 className="text-white font-semibold mb-4">Ressourcer</h4>
                                <ul className="space-y-2">
                                    <li><a href="#" className="text-gray-400 hover:text-blue-400 transition">Regler & Guides</a></li>
                                    <li><a href="#" className="text-gray-400 hover:text-blue-400 transition">Strategi Artikler</a></li>
                                    <li><a href="#" className="text-gray-400 hover:text-blue-400 transition">Community</a></li>
                                    <li><a href="#" className="text-gray-400 hover:text-blue-400 transition">Kontakt Os</a></li>
                                </ul>
                            </div>
                        </div>
                        
                        <div className="border-t border-gray-800 pt-8 flex flex-col md:flex-row justify-between items-center">
                            <p className="text-gray-500 text-sm">
                                &copy; {new Date().getFullYear()} KortspilsPortalen. Alle rettigheder forbeholdes.
                            </p>
                            <div className="flex space-x-4 mt-4 md:mt-0">
                                <a href="#" className="text-gray-500 hover:text-white transition">
                                    Betingelser
                                </a>
                                <a href="#" className="text-gray-500 hover:text-white transition">
                                    Privatlivspolitik
                                </a>
                            </div>
                        </div>
                    </div>
                </footer>
            );
        };

        const App = () => {
            return (
                <div className="min-h-screen bg-gray-900 text-gray-100 font-sans selection:bg-blue-500/30">
                    <Navbar />
                    <main>
                        <Hero />
                        <GamesSection />
                        <InfoSection />
                    </main>
                    <Footer />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <!-- Fallback styling for loading state if needed -->
    <style>
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob {
            animation: blob 7s infinite;
        }
        .animation-delay-2000 {
            animation-delay: 2s;
        }
        .animation-delay-4000 {
            animation-delay: 4s;
        }
    </style>
</body>
</html>
